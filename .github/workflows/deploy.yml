name: Deploy Frontend (Next.js)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Остановка при любой ошибке
            set -o pipefail  # Отлов ошибок в пайпах

            cd /opt/frontend
            # Настраиваем Git
            git config --global user.email "deploy@example.com"
            git config --global user.name "Deploy Bot"
            # Настраиваем Git для автоматического использования токена
            git config --global credential.helper store
            git config --global credential.https://github.com.username ${{ github.actor }}
            # Создаем файл с токеном для автоматической аутентификации
            echo "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials
            # Используем токен в URL для аутентификации (отдельный репозиторий фронтенда)
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/ilyaseverin/interactive_map_frontend.git
            git pull origin main
            docker-compose down || true  # Игнорируем ошибку если контейнеры не запущены
            docker-compose build --no-cache
            docker-compose up -d
            docker system prune -f || true  # Игнорируем ошибку если нечего чистить
